# Scheduled MLS Grid replication (CLAUDE.md §7.7, Phase A).
#
# Every 12 hours (the NWMLS/MLS Grid minimum refresh), replicate the feed in
# remote-media mode: listing data + any NEW photos go to Supabase Storage, the
# fresh snapshot is published to the bucket, then a Netlify build hook rebuilds
# the site from it. Already-replicated photos are skipped via the bucket
# manifest, so routine runs take minutes; the ~20h initial photo backfill is a
# one-time local run (see CLAUDE.md), not a CI job.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   MLSGRID_TOKEN              demo token for staging; prod token at cutover
#   MLSGRID_API_BASE           https://api-demo.mlsgrid.com/v2 for staging
#   SUPABASE_URL               https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  Supabase service-role key
#   NETLIFY_BUILD_HOOK_URL     Netlify → Site settings → Build hooks
name: sync-idx

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

concurrency:
  group: sync-idx
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Replicate MLS Grid feed → Supabase
        env:
          MLSGRID_TOKEN: ${{ secrets.MLSGRID_TOKEN }}
          MLSGRID_API_BASE: ${{ secrets.MLSGRID_API_BASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Data + snapshot only while the one-time local media backfill runs:
          # a CI fetcher overlapping the local one doubles the request rate
          # past MLS Grid's 2 req/s cap (their 2026-07-30 email traced our
          # token suspension to exactly such a 4/s burst). Media already in
          # the bucket manifest still serves. REMOVE this line once the
          # initial import completes so scheduled runs fetch new photos.
          MLSGRID_NO_FETCH: 'true'
        run: npm run sync:idx

      - name: Trigger Netlify rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl -sf -X POST "$HOOK" -d '{}'
