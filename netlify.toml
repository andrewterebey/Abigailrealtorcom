# Netlify build configuration.
#
# The Next.js runtime is auto-detected by Netlify — no plugin or publish
# directory needs to be set here. We override ONLY the build command, because
# the IDX data the site serves is gitignored and must be regenerated on the
# build host:
#   - data/mlsgrid-snapshot.json  (the listing snapshot MLSGridProvider reads)
#   - public/idx/<id>/*.jpg   (listing photos downloaded from the MLS Grid feed)
#
# With SUPABASE_ANON_KEY set the site reads Postgres at request time and the
# build needs no data step at all. Without it (snapshot mode) the build
# downloads the snapshot the scheduled sync (.github/workflows/sync-idx.yml)
# already published. The build must NEVER run `sync:idx`: a sync on the build
# host writes to the shared bucket and Postgres with whatever token Netlify
# holds, and on 2026-10-19 that fallback replaced the production `listings`
# table with 66 demo rows. If the snapshot is missing, let the build fail —
# a failed build leaves the previous deploy in place.
#
# NOTE: a netlify.toml build command OVERRIDES any command set in the Netlify
# dashboard. Set the secrets/flags (MLSGRID_TOKEN, MLSGRID_API_BASE,
# MLSGRID_ORIGINATING_SYSTEM, SUPABASE_URL, SUPABASE_MEDIA_BUCKET,
# NEXT_PUBLIC_IDX_NWMLS, NEXT_PUBLIC_NOINDEX) under Site settings →
# Environment, not here. SUPABASE_SERVICE_ROLE_KEY is NOT needed on Netlify —
# builds only read the public bucket.
[build]
  command = "if [ -n \"$MLSGRID_TOKEN\" ] && [ -z \"$SUPABASE_ANON_KEY\" ]; then npm run fetch:snapshot; fi && npm run build"
